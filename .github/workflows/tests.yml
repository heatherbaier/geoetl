name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest now resolves to a newer Ubuntu release than
          # actions/setup-python has a prebuilt Python 3.9 for -- pin that
          # job to an older image instead of dropping the floor version.
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install geoetl with test extras
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest -v --cov=geoetl --cov-report=term-missing
